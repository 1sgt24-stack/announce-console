<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>워터파크 안내방송</title>
<meta name="theme-color" content="#0a7c8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eaf2f3; --surface:#ffffff; --sunk:#f3f8f9; --ink:#0e2a32; --muted:#527079; --line:#cfdfe2;
  --pool:#0a7c8c; --pool-ink:#ffffff; --pool-soft:#d5edf0;
  --alert:#cc3524; --alert-soft:#fbe2dd; --event:#a35d00; --event-soft:#fcecd4; --ops:#3d5a99; --ops-soft:#e1e8f7; --ok:#1d8656; --ok-soft:#dcf2e6;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0a181d; --surface:#11252c; --sunk:#0d1f25; --ink:#e2f0f2; --muted:#8eaab1; --line:#21404a;
  --pool:#36b8c8; --pool-ink:#04252b; --pool-soft:#123a43;
  --alert:#ff6e5c; --alert-soft:#3b1a16; --event:#f0a43c; --event-soft:#3a2a12; --ops:#8fa8e6; --ops-soft:#1c2747; --ok:#4cc58b; --ok-soft:#123826;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pool);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.clock{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.season{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.season button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:14px;color:var(--muted)}
.season button[aria-pressed="true"]{background:var(--pool);color:var(--pool-ink);font-weight:700}
.season button[data-s="closed"][aria-pressed="true"]{background:var(--muted);color:var(--surface)}
.conn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 12px;font-size:13.5px;max-width:100%}
.conn i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.conn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn.ok i{background:var(--ok)} .conn.ok{border-color:var(--ok)}
.conn.bad i{background:var(--alert)} .conn.bad{border-color:var(--alert)}
.conn.wait i{background:var(--event)}
.conn.station{background:var(--ok-soft);border-color:var(--ok);font-weight:700}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:6px 8px 0;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--pool)}
.tabpanel{padding:16px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 13px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--sunk);
  border-radius:var(--r);padding:12px 12px 12px 15px;min-height:118px;overflow:hidden;transition:transform .12s,border-color .12s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
.card:hover{border-color:var(--cat)} .card:active{transform:scale(.985)}
.card .t{font-weight:700;font-size:15px;line-height:1.35;padding-right:26px}
.card .p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{margin-top:auto;display:flex;gap:6px;align-items:center}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--cat-soft);color:var(--cat)}
.en{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:var(--f-mono)}
.edit{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:15px}
.edit:hover{background:var(--surface);color:var(--ink)}
.c-safety{--cat:var(--pool);--cat-soft:var(--pool-soft)} .c-event{--cat:var(--event);--cat-soft:var(--event-soft)}
.c-ops{--cat:var(--ops);--cat-soft:var(--ops-soft)} .c-emergency{--cat:var(--alert);--cat-soft:var(--alert-soft)}
.card.c-emergency{background:var(--alert-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:96px;line-height:1.55}
.row{display:flex;flex-wrap:wrap;gap:10px} .row>*{flex:1 1 160px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--pool);border-color:var(--pool);color:var(--pool-ink);font-weight:700}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:700}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:16px 22px;font-size:18px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}
.preview{background:var(--sunk);border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
h3.sec{margin:0;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.auto-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;font-weight:700;text-align:left}
.switch .track{width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .track{background:var(--ok)} .switch[aria-checked="true"] .track::after{left:23px}
.switch:disabled{opacity:.5;cursor:not-allowed}
.next{font-size:14px;color:var(--muted)} .next b{color:var(--ink);font-family:var(--f-mono)}
.sched-wrap{overflow-x:auto}
table.sched{width:100%;border-collapse:collapse;min-width:520px}
.sched th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.sched td{padding:6px 8px;border-bottom:1px solid var(--line)}
.sched td.tm{width:120px} .sched td.on{width:60px;text-align:center} .sched td.del{width:44px;position:relative}
.sched tr.done td{opacity:.5} .sched tr.upcoming td{background:var(--pool-soft)}
.note{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.side{display:flex;flex-direction:column;gap:16px}
.onair{padding:16px;display:flex;flex-direction:column;gap:12px;border-width:2px}
.onair.live{border-color:var(--alert)}
.onair-head{display:flex;align-items:center;justify-content:space-between}
.lamp{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;color:var(--muted)}
.lamp i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.live .lamp{color:var(--alert)} .live .lamp i{background:var(--alert);box-shadow:0 0 0 4px var(--alert-soft);animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.35}}
.bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.bars span{width:4px;height:4px;background:var(--line);border-radius:2px}
.live .bars span{background:var(--alert);animation:eq .9s ease-in-out infinite}
.live .bars span:nth-child(2){animation-delay:.15s}.live .bars span:nth-child(3){animation-delay:.3s}.live .bars span:nth-child(4){animation-delay:.45s}.live .bars span:nth-child(5){animation-delay:.2s}
@keyframes eq{0%,100%{height:4px}50%{height:22px}}
.now-title{font-weight:700;font-size:17px;margin:0}
.now-text{margin:0;font-size:14.5px;color:var(--muted);max-height:9.5em;overflow:auto}
.now-text mark{background:var(--alert-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.queue{font-size:13px;color:var(--muted)}
.set{padding:16px;display:flex;flex-direction:column;gap:12px}
.set h2,.log h2{font-size:15px;margin:0}
.range{display:grid;grid-template-columns:64px minmax(0,1fr) 42px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.range output{font-family:var(--f-mono);text-align:right;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--pool)}
.checks{display:flex;flex-direction:column;gap:6px;font-size:14px} .checks label{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.warn{font-size:13px;background:var(--event-soft);color:var(--ink);border-radius:8px;padding:8px 10px;margin:0}
.log{padding:16px;display:flex;flex-direction:column;gap:8px}
.log ol{list-style:none;margin:0;padding:0;max-height:280px;overflow:auto}
.log li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.log li time{font-family:var(--f-mono);color:var(--muted)}
.log li small{font-size:12px;color:var(--muted);text-align:right}
.modal{position:fixed;inset:0;background:rgba(5,20,25,.6);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:19px}
.modal p{margin:0}
.code{font-family:var(--f-mono);letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);
  padding:11px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
/* 하단 고정 바: 태블릿 세로·휴대폰에서만 */
.mbar{display:none}
@media (max-width:900px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mbar{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -4px 16px rgba(5,30,36,.08);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .mbar i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
  .mbar.off i{background:var(--alert)}
  .mbar.live{border-top:2px solid var(--alert)}
  .mbar.live i{background:var(--alert);box-shadow:0 0 0 4px var(--alert-soft);animation:blink 1.1s infinite}
  .mbar .mtxt{flex:1;min-width:0;font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbar.live .mtxt{color:var(--alert)}
  .mbar .btn{padding:10px 16px;flex:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
/* 휴대폰 */
@media (max-width:640px){
  body{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .wrap{gap:12px}
  .top{gap:8px}
  .brand{order:1;flex:1 1 auto;min-width:0}
  .brand h1{font-size:21px;white-space:nowrap}
  .clock{order:2;font-size:17px}
  .season{order:3;flex:1 1 100%}
  .season button{flex:1;padding:6px 8px;font-size:13px}
  .conn{order:4;flex:1 1 100%;font-size:12.5px;padding:5px 12px 5px 10px}
  .tabs{padding:4px 4px 0}
  .tabs button{padding:9px 11px;font-size:14px}
  .tabpanel{padding:12px;gap:12px}
  .lib{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{min-height:92px;padding:10px 8px 10px 12px;gap:4px}
  .card .t{font-size:14px;padding-right:22px}
  .card .p{font-size:12px}
  .edit{top:4px;right:2px}
  .chip{padding:5px 11px;font-size:13px}
  .btn.big{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>안내방송 콘솔</h1></div>
    <div class="season" role="group" aria-label="운영 시즌">
      <button type="button" data-s="gold">골드시즌</button>
      <button type="button" data-s="normal">일반 운영</button>
      <button type="button" data-s="closed">정기휴장</button>
    </div>
    <button type="button" class="conn wait" id="connBtn" aria-label="연결 설정 열기"><i></i><span id="connTxt">연결 확인 중</span></button>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="grid">
    <main class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="t-lib" aria-selected="true" aria-controls="p-lib">즉시 방송</button>
        <button role="tab" id="t-tpl" aria-selected="false" aria-controls="p-tpl">호출·미아 템플릿</button>
        <button role="tab" id="t-free" aria-selected="false" aria-controls="p-free">직접 입력</button>
        <button role="tab" id="t-sched" aria-selected="false" aria-controls="p-sched">자동 방송 시간표</button>
      </div>

      <section class="tabpanel" id="p-lib" role="tabpanel" aria-labelledby="t-lib">
        <div class="chips" id="filters" role="group" aria-label="분류"></div>
        <div class="lib" id="lib"></div>
        <p class="hint">카드를 누르면 방송됩니다. 연필 아이콘으로 멘트를 고치면 모든 기기에 함께 반영됩니다.</p>
      </section>

      <section class="tabpanel" id="p-tpl" role="tabpanel" aria-labelledby="t-tpl" hidden>
        <div class="chips" id="tplPick" role="group" aria-label="템플릿 종류"></div>
        <div class="row" id="tplFields"></div>
        <h3 class="sec">방송 문안 미리보기</h3>
        <div class="preview" id="tplPreview"></div>
        <div class="actions"><button class="btn primary big" id="tplGo" type="button">▶ 방송하기</button></div>
      </section>

      <section class="tabpanel" id="p-free" role="tabpanel" aria-labelledby="t-free" hidden>
        <label class="f" for="freeKo">한국어 멘트<textarea id="freeKo"></textarea></label>
        <label class="f" for="freeEn">영어 멘트 (선택)<textarea id="freeEn" style="min-height:64px"></textarea></label>
        <div class="row">
          <label class="f" for="freeTitle">저장할 이름<input type="text" id="freeTitle"></label>
          <label class="f" for="freeCat">분류<select id="freeCat"><option value="safety">안전</option><option value="event">이벤트</option><option value="ops" selected>운영</option><option value="emergency">긴급</option></select></label>
        </div>
        <div class="actions">
          <button class="btn primary" id="freeGo" type="button">▶ 바로 방송</button>
          <button class="btn" id="freeSave" type="button">멘트 목록에 저장</button>
        </div>
      </section>

      <section class="tabpanel" id="p-sched" role="tabpanel" aria-labelledby="t-sched" hidden>
        <div class="auto-bar">
          <button type="button" class="switch" id="autoSw" role="switch" aria-checked="false"><span class="track"></span><span id="autoLbl">자동 방송 꺼짐</span></button>
          <div class="next" id="nextInfo"></div>
        </div>
        <p class="note" id="schedRole" hidden></p>
        <p class="hint" id="schedHint"></p>
        <div id="schedArea"></div>
        <div class="actions"><button class="btn" id="addRow" type="button">+ 시간 추가</button></div>
      </section>
    </main>

    <aside class="side">
      <section class="panel onair" id="onair" aria-live="polite">
        <div class="onair-head">
          <span class="lamp"><i></i><span id="lampTxt">STANDBY</span></span>
          <span class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        </div>
        <p class="now-title" id="nowTitle">방송 대기 중</p>
        <p class="now-text" id="nowText"></p>
        <p class="queue" id="queueInfo" hidden></p>
        <button class="btn danger" id="stopBtn" type="button" disabled>■ 방송 중지</button>
      </section>

      <section class="panel set" id="voicePanel">
        <h2>음성 설정 <small class="hint" style="font-weight:400">(이 기기)</small></h2>
        <label class="f" for="voiceSel">한국어 음성<select id="voiceSel"></select></label>
        <p class="warn" id="voiceWarn" hidden></p>
        <div class="range"><label for="rate">속도</label><input type="range" id="rate" min="0.6" max="1.4" step="0.05"><output id="rateO"></output></div>
        <div class="range"><label for="pitch">높낮이</label><input type="range" id="pitch" min="0.6" max="1.4" step="0.05"><output id="pitchO"></output></div>
        <div class="range"><label for="vol">음량</label><input type="range" id="vol" min="0.1" max="1" step="0.05"><output id="volO"></output></div>
        <div class="checks">
          <label><input type="checkbox" id="chime"> 방송 앞뒤 차임 (딩동댕)</label>
          <label><input type="checkbox" id="multi"> 영어 멘트가 있으면 이어서 방송</label>
        </div>
        <div style="display:flex;align-items:center;gap:10px;font-size:14px">반복 <div class="seg" id="repeatSeg"><button type="button" data-r="1">1회</button><button type="button" data-r="2">2회</button></div></div>
        <button class="btn ghost" id="testVoice" type="button">이 기기에서 음성 테스트</button>
      </section>

      <section class="panel log">
        <h2>방송 기록</h2>
        <ol id="logList"></ol>
      </section>
    </aside>
  </div>
</div>

<!-- 멘트 수정 -->
<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">멘트 수정</h2>
    <label class="f" for="mName">이름<input type="text" id="mName"></label>
    <label class="f" for="mCat">분류<select id="mCat"><option value="safety">안전</option><option value="event">이벤트</option><option value="ops">운영</option><option value="emergency">긴급</option></select></label>
    <label class="f" for="mKo">한국어 멘트<textarea id="mKo"></textarea></label>
    <label class="f" for="mEn">영어 멘트 (선택)<textarea id="mEn" style="min-height:64px"></textarea></label>
    <div class="actions" style="justify-content:space-between">
      <button class="btn ghost" id="mDel" type="button" style="color:var(--alert)">삭제</button>
      <div class="actions">
        <button class="btn" id="mCancel" type="button">취소</button>
        <button class="btn" id="mPlay" type="button">이 기기에서 듣기</button>
        <button class="btn primary" id="mSave" type="button">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 연결 설정 -->
<div class="modal" id="setModal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h2 id="sTitle">연결 설정</h2>
    <p class="note" id="sStatus"></p>
    <label class="f" for="sCode">업장 코드 <span class="hint">모든 기기에 같은 코드를 입력합니다</span>
      <input type="text" id="sCode" class="code" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </label>
    <div class="actions">
      <button class="btn" id="sNewCode" type="button">새 코드 만들기</button>
      <button class="btn" id="sCopyLink" type="button">연결 링크 복사</button>
    </div>
    <label class="f" for="sName">이 기기 이름<input type="text" id="sName" placeholder="예: 방송실 태블릿, 안내데스크 PC"></label>
    <button type="button" class="switch" id="sStation" role="switch" aria-checked="false"><span class="track"></span><span>이 기기를 방송 스테이션으로 사용<br><small class="hint" style="font-weight:400">앰프에 연결된 태블릿 한 대만 켜 주세요. 나머지 기기는 리모컨이 됩니다.</small></span></button>
    <p class="warn" id="sWarn" hidden></p>
    <div class="actions" style="justify-content:flex-end">
      <button class="btn" id="sCancel" type="button">닫기</button>
      <button class="btn primary" id="sSave" type="button">저장하고 연결</button>
    </div>
  </div>
</div>

<!-- 스테이션 시작 (소리 허용) -->
<div class="modal" id="unlock" hidden>
  <div class="box" style="text-align:center;align-items:center">
    <h2>방송 스테이션</h2>
    <p>이 기기가 안내방송을 송출합니다.<br>아래 버튼을 눌러 소리를 켜 주세요.</p>
    <button class="btn primary big" id="unlockBtn" type="button">방송 스테이션 시작</button>
    <p class="hint">화면이 꺼지지 않도록 유지합니다. 태블릿은 충전기에 연결해 두세요.</p>
  </div>
</div>

<div class="mbar" id="mbar" aria-live="polite">
  <i aria-hidden="true"></i>
  <span class="mtxt" id="mTxt">방송 대기 중</span>
  <button class="btn danger" id="mStop" type="button" disabled>■ 중지</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
